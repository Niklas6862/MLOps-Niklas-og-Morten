# Override training config for DeepSpeed ZeRO training.
# Merge on top of training.yaml:
#   python train.py --config configs/base.yaml configs/data.yaml configs/model.yaml \
#                   configs/training.yaml configs/training_deepspeed.yaml
#
# Switch between ZeRO stages by changing the deepspeed path:
#   Stage 2 (shard optimizer states + gradients): configs/deepspeed_zero2.json
#   Stage 3 (+ shard model params, CPU offload): configs/deepspeed_zero3.json

training:
  deepspeed: "configs/deepspeed_zero2.json"
  fp16: true
  # Increase batch size since ZeRO reduces per-GPU memory pressure
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
