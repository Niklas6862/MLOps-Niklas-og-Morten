version: "3.9"

# Provides two named services sharing the same image:
#   - trainer:  runs the fine-tuning pipeline
#   - mlflow:   serves the MLflow tracking UI on port 5000
#
# Usage:
#   docker compose up trainer        # run training
#   docker compose up mlflow         # view experiment dashboard
#   docker compose run --rm trainer  # one-shot training run

services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: image-classifier:latest
    command: python train.py
    volumes:
      # Mount local directories so artifacts and cache persist outside the container
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/models/hf_cache
    # Uncomment if you have a GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns

  monitoring-api:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --quiet fastapi prometheus-client prometheus-fastapi-instrumentator uvicorn pydantic mlflow pandas &&
             uvicorn monitoring_api:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./monitoring_api.py:/app/monitoring_api.py
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=/app/mlruns
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/mlops.json
    volumes:
      - ./monitoring:/var/lib/grafana/monitoring
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
